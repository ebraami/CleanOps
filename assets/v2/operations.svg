<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
  <filter id="g1" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g2" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g3" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#060910"/>
    <stop offset="50%" stop-color="#0A0F1D"/>
    <stop offset="100%" stop-color="#060910"/>
  </linearGradient>
  <linearGradient id="oG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
    <stop offset="30%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="70%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbG">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1B2A52" stroke-width="0.4" opacity="0.4"/>
  </pattern>
</defs>
  <rect width="1200" height="300" fill="url(#bgG)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <!-- ambient orbs -->
  <circle cx="180.0" cy="90.0" r="80" fill="url(#orbG)" opacity="0.5">
    <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020.0" cy="210.0" r="60" fill="url(#orbG)" opacity="0.4">
    <animate attributeName="r" values="60;80;60" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600.0" cy="30.0" r="40" fill="url(#orbG)" opacity="0.3">
    <animate attributeName="r" values="40;55;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- signal line -->
  <line x1="600" y1="0" x2="600" y2="300" stroke="url(#oG)" stroke-width="2" opacity="0.6"/>
  <circle r="3" fill="#F97316" filter="url(#g2)">
    <animate attributeName="cy" values="0;300" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#FFFFFF" filter="url(#g3)">
    <animate attributeName="cy" values="0;300" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- track -->
  <path id="optrack" d="M 100 150 L 100.0 150 L 300.0 150 L 500.0 150 L 700.0 150 L 900.0 150 L 1100.0 150" fill="none" stroke="#1B2A52" stroke-width="3"/>

  <!-- progressive fill -->
  <path d="M 100 150 L 100.0 150 L 300.0 150 L 500.0 150 L 700.0 150 L 900.0 150 L 1100.0 150" fill="none" stroke="#F97316" stroke-width="3" stroke-dasharray="0 2000" filter="url(#g3)">
    <animate attributeName="stroke-dasharray" values="0 2000;2000 2000" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- traveling case -->
  <g>
    <circle r="8" fill="#F97316" filter="url(#g1)">
      <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#optrack"/></animateMotion>
    </circle>
    <circle r="4" fill="#FFFFFF">
      <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#optrack"/></animateMotion>
    </circle>
  </g>

  
    <g transform="translate(100.0,150)">
      <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#111C38" stroke="#94A3B8" stroke-width="2"/>
      <text x="0" y="4" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#94A3B8" text-anchor="middle">REPORTED</text>
    </g>
    <g transform="translate(300.0,150)">
      <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#111C38" stroke="#3B82F6" stroke-width="2"/>
      <text x="0" y="4" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#3B82F6" text-anchor="middle">PRIORITIZED</text>
    </g>
    <g transform="translate(500.0,150)">
      <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#111C38" stroke="#F59E0B" stroke-width="2"/>
      <text x="0" y="4" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#F59E0B" text-anchor="middle">ASSIGNED</text>
    </g>
    <g transform="translate(700.0,150)">
      <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#111C38" stroke="#F97316" stroke-width="2"/>
      <text x="0" y="4" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#F97316" text-anchor="middle">IN PROGRESS</text>
    </g>
    <g transform="translate(900.0,150)">
      <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#111C38" stroke="#8B5CF6" stroke-width="2"/>
      <text x="0" y="4" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#8B5CF6" text-anchor="middle">EVIDENCE</text>
    </g>
    <g transform="translate(1100.0,150)">
      <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#111C38" stroke="#10B981" stroke-width="2"/>
      <text x="0" y="4" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#10B981" text-anchor="middle">VERIFIED</text>
    </g>

  <text x="600" y="30" font-family="Arial,sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="5">STATE-MANAGED AUDIT TRAIL</text>
</svg>