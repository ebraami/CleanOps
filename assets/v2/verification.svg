<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450">
  <defs>
  <filter id="g1" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g2" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g3" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#060910"/>
    <stop offset="50%" stop-color="#0A0F1D"/>
    <stop offset="100%" stop-color="#060910"/>
  </linearGradient>
  <linearGradient id="oG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
    <stop offset="30%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="70%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbG">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1B2A52" stroke-width="0.4" opacity="0.4"/>
  </pattern>
</defs>
  <rect width="1200" height="450" fill="url(#bgG)"/>
  <rect width="1200" height="450" fill="url(#grid)"/>
  <!-- ambient orbs -->
  <circle cx="180.0" cy="135.0" r="80" fill="url(#orbG)" opacity="0.5">
    <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020.0" cy="315.0" r="60" fill="url(#orbG)" opacity="0.4">
    <animate attributeName="r" values="60;80;60" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600.0" cy="45.0" r="40" fill="url(#orbG)" opacity="0.3">
    <animate attributeName="r" values="40;55;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- signal line -->
  <line x1="600" y1="0" x2="600" y2="450" stroke="url(#oG)" stroke-width="2" opacity="0.6"/>
  <circle r="3" fill="#F97316" filter="url(#g2)">
    <animate attributeName="cy" values="0;450" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#FFFFFF" filter="url(#g3)">
    <animate attributeName="cy" values="0;450" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(600,235)">
    <!-- orbit track -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#1B2A52" stroke-width="2" stroke-dasharray="8 8"/>

    <!-- loop path for animation -->
    <path id="looppath" d="M 0 -140 A 140 140 0 1 1 -0.01 -140" fill="none"/>

    <!-- progressive draw -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="0 900" filter="url(#g3)">
      <animate attributeName="stroke-dasharray" values="0 900;880 900" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- traveling signal -->
    <circle r="8" fill="#10B981" filter="url(#g1)">
      <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#looppath"/></animateMotion>
    </circle>
    <circle r="3" fill="#FFFFFF">
      <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#looppath"/></animateMotion>
    </circle>

    <!-- center verification icon -->
    <circle cx="0" cy="0" r="45" fill="#111C38" stroke="#10B981" stroke-width="2.5" filter="url(#g2)"/>
    <path d="M -18 0 L -6 12 L 18 -10" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- cardinal labels -->
    <text x="0" y="-160" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0" text-anchor="middle">1. REPORT SUBMITTED</text>
    <text x="170" y="4" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0" text-anchor="start">2. WORK COMPLETED</text>
    <text x="0" y="170" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#10B981" text-anchor="middle">3. EVIDENCE VERIFIED</text>
    <text x="-170" y="4" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0" text-anchor="end">4. CITIZEN NOTIFIED</text>

    <!-- cardinal nodes -->
    <circle cx="0" cy="-140" r="8" fill="#111C38" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="140" cy="0" r="8" fill="#111C38" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="0" cy="140" r="8" fill="#111C38" stroke="#10B981" stroke-width="2"/>
    <circle cx="-140" cy="0" r="8" fill="#111C38" stroke="#E2E8F0" stroke-width="2"/>
  </g>

  <text x="600" y="35" font-family="Arial,sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="5">CLOSED VERIFICATION LOOP</text>
</svg>