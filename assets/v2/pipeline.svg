<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350">
  <defs>
  <filter id="g1" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g2" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g3" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#060910"/>
    <stop offset="50%" stop-color="#0A0F1D"/>
    <stop offset="100%" stop-color="#060910"/>
  </linearGradient>
  <linearGradient id="oG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
    <stop offset="30%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="70%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbG">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1B2A52" stroke-width="0.4" opacity="0.4"/>
  </pattern>
</defs>
  <rect width="1200" height="350" fill="url(#bgG)"/>
  <rect width="1200" height="350" fill="url(#grid)"/>
  <!-- ambient orbs -->
  <circle cx="180.0" cy="105.0" r="80" fill="url(#orbG)" opacity="0.5">
    <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020.0" cy="244.99999999999997" r="60" fill="url(#orbG)" opacity="0.4">
    <animate attributeName="r" values="60;80;60" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600.0" cy="35.0" r="40" fill="url(#orbG)" opacity="0.3">
    <animate attributeName="r" values="40;55;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- signal line -->
  <line x1="600" y1="0" x2="600" y2="350" stroke="url(#oG)" stroke-width="2" opacity="0.6"/>
  <circle r="3" fill="#F97316" filter="url(#g2)">
    <animate attributeName="cy" values="0;350" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#FFFFFF" filter="url(#g3)">
    <animate attributeName="cy" values="0;350" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- connection path -->
  <path id="flow" d="M 80 175 L 80.0 175 L 253.33333333333334 175 L 426.6666666666667 175 L 600.0 175 L 773.3333333333334 175 L 946.6666666666667 175 L 1120.0 175" fill="none" stroke="#1B2A52" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- animated signal along path -->
  <circle r="6" fill="#F97316" filter="url(#g1)">
    <animateMotion dur="5s" repeatCount="indefinite">
      <mpath href="#flow"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#FFFFFF">
    <animateMotion dur="5s" repeatCount="indefinite">
      <mpath href="#flow"/>
    </animateMotion>
  </circle>

  <!-- trailing glow -->
  <circle r="12" fill="#F97316" filter="url(#soft)" opacity="0.3">
    <animateMotion dur="5s" repeatCount="indefinite">
      <mpath href="#flow"/>
    </animateMotion>
  </circle>

  <!-- nodes -->
  
    <g transform="translate(80.0,175)">
      <circle cx="0" cy="0" r="28" fill="#111C38" stroke="#E2E8F0" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.3s"/>
      </circle>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#E2E8F0" stroke-width="1" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0" dur="3s" begin="1.0s" repeatCount="indefinite"/>
        <animate attributeName="r" values="28;40;28" dur="3s" begin="1.0s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="50" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0" text-anchor="middle" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.5s"/>
        CITIZEN
      </text>
    </g>
    <g transform="translate(253.33333333333334,175)">
      <circle cx="0" cy="0" r="28" fill="#111C38" stroke="#3B82F6" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.7s"/>
      </circle>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="28;40;28" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="50" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#3B82F6" text-anchor="middle" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.9s"/>
        REPORT
      </text>
    </g>
    <g transform="translate(426.6666666666667,175)">
      <circle cx="0" cy="0" r="28" fill="#111C38" stroke="#8B5CF6" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.1s"/>
      </circle>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0" dur="3s" begin="2.0s" repeatCount="indefinite"/>
        <animate attributeName="r" values="28;40;28" dur="3s" begin="2.0s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="50" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#8B5CF6" text-anchor="middle" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.3s"/>
        AI ANALYSIS
      </text>
    </g>
    <g transform="translate(600.0,175)">
      <circle cx="0" cy="0" r="28" fill="#111C38" stroke="#F97316" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.5000000000000002s"/>
      </circle>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#F97316" stroke-width="1" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0" dur="3s" begin="2.5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="28;40;28" dur="3s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="50" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#F97316" text-anchor="middle" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.7000000000000002s"/>
        PRIORITY
      </text>
    </g>
    <g transform="translate(773.3333333333334,175)">
      <circle cx="0" cy="0" r="28" fill="#111C38" stroke="#F59E0B" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.9000000000000001s"/>
      </circle>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0" dur="3s" begin="3.0s" repeatCount="indefinite"/>
        <animate attributeName="r" values="28;40;28" dur="3s" begin="3.0s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="50" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#F59E0B" text-anchor="middle" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="2.1s"/>
        DISPATCH
      </text>
    </g>
    <g transform="translate(946.6666666666667,175)">
      <circle cx="0" cy="0" r="28" fill="#111C38" stroke="#10B981" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="2.3s"/>
      </circle>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#10B981" stroke-width="1" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0" dur="3s" begin="3.5s" repeatCount="indefinite"/>
        <animate attributeName="r" values="28;40;28" dur="3s" begin="3.5s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="50" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#10B981" text-anchor="middle" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="2.5s"/>
        CLEAN
      </text>
    </g>
    <g transform="translate(1120.0,175)">
      <circle cx="0" cy="0" r="28" fill="#111C38" stroke="#10B981" stroke-width="2.5" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="2.7s"/>
      </circle>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#10B981" stroke-width="1" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0" dur="3s" begin="4.0s" repeatCount="indefinite"/>
        <animate attributeName="r" values="28;40;28" dur="3s" begin="4.0s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="50" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#10B981" text-anchor="middle" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="2.9000000000000004s"/>
        VERIFIED
      </text>
    </g>

  <!-- return path (loop back) -->
  <path d="M 1120.0 205 Q 600 275 80 205" fill="none" stroke="#1B2A52" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
  <circle r="3" fill="#10B981" filter="url(#g3)" opacity="0.6">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#flow"/>
    </animateMotion>
  </circle>

  <!-- label -->
  <text x="600" y="30" font-family="Arial,sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="5">END-TO-END OPERATIONAL PIPELINE</text>
</svg>