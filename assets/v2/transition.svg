<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70">
  <defs>
  <filter id="g1" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g2" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g3" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#060910"/>
    <stop offset="50%" stop-color="#0A0F1D"/>
    <stop offset="100%" stop-color="#060910"/>
  </linearGradient>
  <linearGradient id="oG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
    <stop offset="30%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="70%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbG">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1B2A52" stroke-width="0.4" opacity="0.4"/>
  </pattern>
</defs>
  <rect width="1200" height="70" fill="url(#bgG)"/>
  <rect width="1200" height="70" fill="url(#grid)"/>

  <!-- signal line continues -->
  <line x1="600" y1="0" x2="600" y2="70" stroke="url(#oG)" stroke-width="2" opacity="0.6"/>

  <!-- center node -->
  <circle cx="600" cy="35" r="5" fill="#F97316" filter="url(#g2)">
    <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- horizontal accent lines -->
  <line x1="500" y1="35" x2="585" y2="35" stroke="#1B2A52" stroke-width="1"/>
  <line x1="615" y1="35" x2="700" y2="35" stroke="#1B2A52" stroke-width="1"/>

  <!-- traveling particle -->
  <circle r="3" fill="#FFFFFF" filter="url(#g3)">
    <animate attributeName="cy" values="0;70" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>