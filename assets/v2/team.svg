<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
  <filter id="g1" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g2" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g3" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#060910"/>
    <stop offset="50%" stop-color="#0A0F1D"/>
    <stop offset="100%" stop-color="#060910"/>
  </linearGradient>
  <linearGradient id="oG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
    <stop offset="30%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="70%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbG">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1B2A52" stroke-width="0.4" opacity="0.4"/>
  </pattern>
</defs>
  <rect width="1200" height="400" fill="url(#bgG)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <!-- ambient orbs -->
  <circle cx="180.0" cy="120.0" r="80" fill="url(#orbG)" opacity="0.5">
    <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020.0" cy="280.0" r="60" fill="url(#orbG)" opacity="0.4">
    <animate attributeName="r" values="60;80;60" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600.0" cy="40.0" r="40" fill="url(#orbG)" opacity="0.3">
    <animate attributeName="r" values="40;55;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- signal line -->
  <line x1="600" y1="0" x2="600" y2="400" stroke="url(#oG)" stroke-width="2" opacity="0.6"/>
  <circle r="3" fill="#F97316" filter="url(#g2)">
    <animate attributeName="cy" values="0;400" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#FFFFFF" filter="url(#g3)">
    <animate attributeName="cy" values="0;400" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- connection ring -->
  <circle cx="600" cy="210" r="140" fill="none" stroke="#1B2A52" stroke-width="1" stroke-dasharray="6 10">
    <animateTransform attributeName="transform" type="rotate" from="0 600 210" to="360 600 210" dur="40s" repeatCount="indefinite"/>
  </circle>

  
    <circle cx="600" cy="210" r="22" fill="#111C38" stroke="#F97316" stroke-width="3" filter="url(#g2)"/>
    <text x="600" y="214" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#F97316" text-anchor="middle">LEAD</text>
    <!-- member 1 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.3s"/>
      <line x1="600" y1="210" x2="600" y2="70" stroke="#1B2A52" stroke-width="1.5"/>
      <circle cx="600" cy="70" r="14" fill="#111C38" stroke="#3B82F6" stroke-width="2"/>
    </g>
    <circle r="3" fill="#F97316" filter="url(#g3)" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.0s" begin="1.0s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;600" dur="2.0s" begin="1.0s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;70" dur="2.0s" begin="1.0s" repeatCount="indefinite"/>
    </circle>
    <!-- member 2 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.5s"/>
      <line x1="600" y1="210" x2="690" y2="103" stroke="#1B2A52" stroke-width="1.5"/>
      <circle cx="690" cy="103" r="14" fill="#111C38" stroke="#10B981" stroke-width="2"/>
    </g>
    <circle r="3" fill="#F97316" filter="url(#g3)" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.2s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;690" dur="2.2s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;103" dur="2.2s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <!-- member 3 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.7s"/>
      <line x1="600" y1="210" x2="738" y2="186" stroke="#1B2A52" stroke-width="1.5"/>
      <circle cx="738" cy="186" r="14" fill="#111C38" stroke="#8B5CF6" stroke-width="2"/>
    </g>
    <circle r="3" fill="#F97316" filter="url(#g3)" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;738" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;186" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <!-- member 4 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.9s"/>
      <line x1="600" y1="210" x2="721" y2="280" stroke="#1B2A52" stroke-width="1.5"/>
      <circle cx="721" cy="280" r="14" fill="#111C38" stroke="#F59E0B" stroke-width="2"/>
    </g>
    <circle r="3" fill="#F97316" filter="url(#g3)" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.6s" begin="1.9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;721" dur="2.6s" begin="1.9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;280" dur="2.6s" begin="1.9s" repeatCount="indefinite"/>
    </circle>
    <!-- member 5 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.1s"/>
      <line x1="600" y1="210" x2="648" y2="342" stroke="#1B2A52" stroke-width="1.5"/>
      <circle cx="648" cy="342" r="14" fill="#111C38" stroke="#3B82F6" stroke-width="2"/>
    </g>
    <circle r="3" fill="#F97316" filter="url(#g3)" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.8s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;648" dur="2.8s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;342" dur="2.8s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <!-- member 6 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.3s"/>
      <line x1="600" y1="210" x2="552" y2="342" stroke="#1B2A52" stroke-width="1.5"/>
      <circle cx="552" cy="342" r="14" fill="#111C38" stroke="#10B981" stroke-width="2"/>
    </g>
    <circle r="3" fill="#F97316" filter="url(#g3)" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3.0s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;552" dur="3.0s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;342" dur="3.0s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <!-- member 7 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.5s"/>
      <line x1="600" y1="210" x2="479" y2="280" stroke="#1B2A52" stroke-width="1.5"/>
      <circle cx="479" cy="280" r="14" fill="#111C38" stroke="#8B5CF6" stroke-width="2"/>
    </g>
    <circle r="3" fill="#F97316" filter="url(#g3)" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3.2s" begin="2.8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;479" dur="3.2s" begin="2.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;280" dur="3.2s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- member 8 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.7s"/>
      <line x1="600" y1="210" x2="462" y2="186" stroke="#1B2A52" stroke-width="1.5"/>
      <circle cx="462" cy="186" r="14" fill="#111C38" stroke="#F59E0B" stroke-width="2"/>
    </g>
    <circle r="3" fill="#F97316" filter="url(#g3)" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3.4s" begin="3.1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;462" dur="3.4s" begin="3.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;186" dur="3.4s" begin="3.1s" repeatCount="indefinite"/>
    </circle>
    <!-- member 9 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.9s"/>
      <line x1="600" y1="210" x2="510" y2="103" stroke="#1B2A52" stroke-width="1.5"/>
      <circle cx="510" cy="103" r="14" fill="#111C38" stroke="#3B82F6" stroke-width="2"/>
    </g>
    <circle r="3" fill="#F97316" filter="url(#g3)" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="3.6s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;510" dur="3.6s" begin="3.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;103" dur="3.6s" begin="3.4s" repeatCount="indefinite"/>
    </circle>

  <!-- label appearing -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="3s"/>
    <text x="600" y="390" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#F97316" text-anchor="middle" letter-spacing="3">TEAM 21</text>
  </g>

  <text x="600" y="35" font-family="Arial,sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="5">COLLABORATIVE ENGINEERING NETWORK</text>
</svg>