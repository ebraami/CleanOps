<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <defs>
  <filter id="g1" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g2" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g3" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#060910"/>
    <stop offset="50%" stop-color="#0A0F1D"/>
    <stop offset="100%" stop-color="#060910"/>
  </linearGradient>
  <linearGradient id="oG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
    <stop offset="30%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="70%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbG">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1B2A52" stroke-width="0.4" opacity="0.4"/>
  </pattern>
</defs>
  <rect width="1200" height="500" fill="url(#bgG)"/>
  <rect width="1200" height="500" fill="url(#grid)"/>
  <!-- ambient orbs -->
  <circle cx="180.0" cy="150.0" r="80" fill="url(#orbG)" opacity="0.5">
    <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020.0" cy="350.0" r="60" fill="url(#orbG)" opacity="0.4">
    <animate attributeName="r" values="60;80;60" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600.0" cy="50.0" r="40" fill="url(#orbG)" opacity="0.3">
    <animate attributeName="r" values="40;55;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- signal line -->
  <line x1="600" y1="0" x2="600" y2="500" stroke="url(#oG)" stroke-width="2" opacity="0.6"/>
  <circle r="3" fill="#F97316" filter="url(#g2)">
    <animate attributeName="cy" values="0;500" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#FFFFFF" filter="url(#g3)">
    <animate attributeName="cy" values="0;500" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze" begin="0.5s"/>
      <rect x="200" y="90" width="800" height="60" rx="6" fill="#111C38" stroke="#3B82F6" stroke-width="2"/>
      <text x="600" y="118" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#3B82F6" text-anchor="middle">PRESENTATION LAYER</text>
      <text x="600" y="135" font-family="Arial,sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Mobile &#183; Web &#183; Admin</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze" begin="1.1s"/>
      <rect x="200" y="180" width="800" height="60" rx="6" fill="#111C38" stroke="#F97316" stroke-width="2"/>
      <text x="600" y="208" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#F97316" text-anchor="middle">EDGE / API LAYER</text>
      <text x="600" y="225" font-family="Arial,sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Routing &#183; Auth &#183; Logic</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze" begin="1.7s"/>
      <rect x="200" y="270" width="800" height="60" rx="6" fill="#111C38" stroke="#10B981" stroke-width="2"/>
      <text x="600" y="298" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">INTELLIGENCE</text>
      <text x="600" y="315" font-family="Arial,sans-serif" font-size="10" fill="#64748B" text-anchor="middle">AI Vision &#183; GIS &#183; Scoring</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze" begin="2.3s"/>
      <rect x="200" y="360" width="800" height="60" rx="6" fill="#111C38" stroke="#E2E8F0" stroke-width="2"/>
      <text x="600" y="388" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#E2E8F0" text-anchor="middle">PERSISTENCE</text>
      <text x="600" y="405" font-family="Arial,sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Database &#183; Storage &#183; RLS</text>
    </g>
  
    <line x1="600" y1="150" x2="600" y2="180" stroke="#1B2A52" stroke-width="2" stroke-dasharray="4 6"/>
    <circle r="4" fill="#F97316" filter="url(#g2)">
      <animate attributeName="cy" values="150;180" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;600" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="600" y1="240" x2="600" y2="270" stroke="#1B2A52" stroke-width="2" stroke-dasharray="4 6"/>
    <circle r="4" fill="#F97316" filter="url(#g2)">
      <animate attributeName="cy" values="240;270" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;600" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <line x1="600" y1="330" x2="600" y2="360" stroke="#1B2A52" stroke-width="2" stroke-dasharray="4 6"/>
    <circle r="4" fill="#F97316" filter="url(#g2)">
      <animate attributeName="cy" values="330;360" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="600;600" dur="2.1s" repeatCount="indefinite"/>
    </circle>

  <text x="600" y="45" font-family="Arial,sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="5">N-TIER SYSTEM ARCHITECTURE</text>
</svg>