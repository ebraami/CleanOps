<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450">
  <defs>
  <filter id="g1" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g2" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g3" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#060910"/>
    <stop offset="50%" stop-color="#0A0F1D"/>
    <stop offset="100%" stop-color="#060910"/>
  </linearGradient>
  <linearGradient id="oG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
    <stop offset="30%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="70%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbG">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1B2A52" stroke-width="0.4" opacity="0.4"/>
  </pattern>
</defs>
  <rect width="1200" height="450" fill="url(#bgG)"/>
  <rect width="1200" height="450" fill="url(#grid)"/>
  <!-- ambient orbs -->
  <circle cx="180.0" cy="135.0" r="80" fill="url(#orbG)" opacity="0.5">
    <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020.0" cy="315.0" r="60" fill="url(#orbG)" opacity="0.4">
    <animate attributeName="r" values="60;80;60" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600.0" cy="45.0" r="40" fill="url(#orbG)" opacity="0.3">
    <animate attributeName="r" values="40;55;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- signal line -->
  <line x1="600" y1="0" x2="600" y2="450" stroke="url(#oG)" stroke-width="2" opacity="0.6"/>
  <circle r="3" fill="#F97316" filter="url(#g2)">
    <animate attributeName="cy" values="0;450" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#FFFFFF" filter="url(#g3)">
    <animate attributeName="cy" values="0;450" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- street grid -->
  <line x1="0" y1="60" x2="0" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="80" y1="60" x2="80" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="160" y1="60" x2="160" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="240" y1="60" x2="240" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="320" y1="60" x2="320" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="400" y1="60" x2="400" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="480" y1="60" x2="480" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="560" y1="60" x2="560" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="640" y1="60" x2="640" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="720" y1="60" x2="720" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="800" y1="60" x2="800" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="880" y1="60" x2="880" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="960" y1="60" x2="960" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="1040" y1="60" x2="1040" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="1120" y1="60" x2="1120" y2="450" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="0" y1="60" x2="1200" y2="60" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="0" y1="120" x2="1200" y2="120" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="0" y1="180" x2="1200" y2="180" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="0" y1="240" x2="1200" y2="240" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="0" y1="300" x2="1200" y2="300" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="0" y1="360" x2="1200" y2="360" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/><line x1="0" y1="420" x2="1200" y2="420" stroke="#1B2A52" stroke-width="0.3" opacity="0.3"/>

  <!-- reports -->
  
    <circle cx="432" cy="251" r="0" fill="#F97316" filter="url(#g3)">
      <animate attributeName="r" values="0;5;4" dur="0.8s" fill="freeze" begin="0.5s"/>
    </circle>
    <circle cx="425" cy="240" r="0" fill="#F97316" filter="url(#g3)">
      <animate attributeName="r" values="0;5;4" dur="0.8s" fill="freeze" begin="0.8s"/>
    </circle>
    <circle cx="424" cy="224" r="0" fill="#F97316" filter="url(#g3)">
      <animate attributeName="r" values="0;5;4" dur="0.8s" fill="freeze" begin="1.1s"/>
    </circle>
    <circle cx="437" cy="270" r="0" fill="#F97316" filter="url(#g3)">
      <animate attributeName="r" values="0;5;4" dur="0.8s" fill="freeze" begin="1.4s"/>
    </circle>
    <circle cx="471" cy="288" r="0" fill="#F97316" filter="url(#g3)">
      <animate attributeName="r" values="0;5;4" dur="0.8s" fill="freeze" begin="1.7s"/>
    </circle>
    <circle cx="430" cy="228" r="0" fill="#F97316" filter="url(#g3)">
      <animate attributeName="r" values="0;5;4" dur="0.8s" fill="freeze" begin="2.0s"/>
    </circle>
    <circle cx="471" cy="290" r="0" fill="#F97316" filter="url(#g3)">
      <animate attributeName="r" values="0;5;4" dur="0.8s" fill="freeze" begin="2.3s"/>
    </circle>
    <circle cx="484" cy="274" r="0" fill="#F97316" filter="url(#g3)">
      <animate attributeName="r" values="0;5;4" dur="0.8s" fill="freeze" begin="2.6s"/>
    </circle>
    <circle cx="100" cy="354" r="0" fill="#3B82F6" opacity="0.6">
      <animate attributeName="r" values="0;4;3" dur="0.8s" fill="freeze" begin="1.5s"/>
    </circle>
    <circle cx="797" cy="193" r="0" fill="#3B82F6" opacity="0.6">
      <animate attributeName="r" values="0;4;3" dur="0.8s" fill="freeze" begin="1.9s"/>
    </circle>
    <circle cx="184" cy="144" r="0" fill="#3B82F6" opacity="0.6">
      <animate attributeName="r" values="0;4;3" dur="0.8s" fill="freeze" begin="2.3s"/>
    </circle>
    <circle cx="1098" cy="340" r="0" fill="#3B82F6" opacity="0.6">
      <animate attributeName="r" values="0;4;3" dur="0.8s" fill="freeze" begin="2.7s"/>
    </circle>
    <circle cx="152" cy="136" r="0" fill="#3B82F6" opacity="0.6">
      <animate attributeName="r" values="0;4;3" dur="0.8s" fill="freeze" begin="3.1s"/>
    </circle>
    <circle cx="802" cy="139" r="0" fill="#3B82F6" opacity="0.6">
      <animate attributeName="r" values="0;4;3" dur="0.8s" fill="freeze" begin="3.5s"/>
    </circle>

  <!-- cluster detection ring -->
  <circle cx="450" cy="250" r="0" fill="none" stroke="#F97316" stroke-width="2" opacity="0">
    <animate attributeName="r" values="0;70" dur="1s" fill="freeze" begin="4s"/>
    <animate attributeName="opacity" values="0;0.8" dur="1s" fill="freeze" begin="4s"/>
  </circle>
  <circle cx="450" cy="250" r="0" fill="#F97316" opacity="0" filter="url(#soft)">
    <animate attributeName="r" values="0;50" dur="1s" fill="freeze" begin="4s"/>
    <animate attributeName="opacity" values="0;0.1" dur="1s" fill="freeze" begin="4s"/>
  </circle>
  <!-- pulsing ring -->
  <circle cx="450" cy="250" r="70" fill="none" stroke="#F97316" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="2s" begin="5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="70;90;70" dur="2s" begin="5s" repeatCount="indefinite"/>
  </circle>

  <!-- hotspot label -->
  <g transform="translate(450,165)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="4.5s"/>
    <rect x="-55" y="-12" width="110" height="24" rx="4" fill="#0A0F1D" stroke="#F97316" stroke-width="1.5"/>
    <text x="0" y="4" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#F97316" text-anchor="middle">HOTSPOT DETECTED</text>
  </g>

  <!-- signal going to operations -->
  <path id="hotpath" d="M 520 250 Q 650 250 1000 225" fill="none" stroke="#F97316" stroke-width="1" stroke-dasharray="4 6" opacity="0">
    <animate attributeName="opacity" values="0;0.5" dur="0.5s" fill="freeze" begin="5.5s"/>
  </path>
  <circle r="4" fill="#F97316" filter="url(#g2)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" fill="freeze" begin="5.5s"/>
    <animateMotion dur="2s" begin="5.5s" repeatCount="indefinite"><mpath href="#hotpath"/></animateMotion>
  </circle>

  <!-- operations endpoint -->
  <g transform="translate(1000,225)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="6s"/>
    <circle cx="0" cy="0" r="18" fill="#111C38" stroke="#10B981" stroke-width="2"/>
    <text x="0" y="30" font-family="Arial,sans-serif" font-size="9" fill="#10B981" text-anchor="middle">OPERATIONS</text>
  </g>

  <text x="600" y="35" font-family="Arial,sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="5">GEOSPATIAL INCIDENT CLUSTERING</text>
</svg>