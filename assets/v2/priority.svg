<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450">
  <defs>
  <filter id="g1" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g2" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="g3" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feComposite in="SourceGraphic" in2="b" operator="over"/>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#060910"/>
    <stop offset="50%" stop-color="#0A0F1D"/>
    <stop offset="100%" stop-color="#060910"/>
  </linearGradient>
  <linearGradient id="oG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
    <stop offset="30%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="70%" stop-color="#F97316" stop-opacity="1"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbG">
    <stop offset="0%" stop-color="#F97316" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1B2A52" stroke-width="0.4" opacity="0.4"/>
  </pattern>
</defs>
  <rect width="1200" height="450" fill="url(#bgG)"/>
  <rect width="1200" height="450" fill="url(#grid)"/>
  <!-- ambient orbs -->
  <circle cx="180.0" cy="135.0" r="80" fill="url(#orbG)" opacity="0.5">
    <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020.0" cy="315.0" r="60" fill="url(#orbG)" opacity="0.4">
    <animate attributeName="r" values="60;80;60" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600.0" cy="45.0" r="40" fill="url(#orbG)" opacity="0.3">
    <animate attributeName="r" values="40;55;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- signal line -->
  <line x1="600" y1="0" x2="600" y2="450" stroke="url(#oG)" stroke-width="2" opacity="0.6"/>
  <circle r="3" fill="#F97316" filter="url(#g2)">
    <animate attributeName="cy" values="0;450" dur="4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#FFFFFF" filter="url(#g3)">
    <animate attributeName="cy" values="0;450" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;600" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- radar background -->
  <g transform="translate(600,245)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#1B2A52" stroke-width="1"/>
    <circle cx="0" cy="0" r="93" fill="none" stroke="#1B2A52" stroke-width="0.5" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#1B2A52" stroke-width="0.5" stroke-dasharray="2 4"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#1B2A52" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#1B2A52" stroke-width="0.5" stroke-dasharray="4 4"/>

    <!-- animated data shape -->
    <polygon points="0,-98 112,0 0,70 -84,0"
             fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-width="2" filter="url(#g3)">
      <animate attributeName="points"
               values="0,-98 112,0 0,70 -84,0;
                       0,-119 84,0 0,98 -105,0;
                       0,-98 112,0 0,70 -84,0"
               dur="6s" repeatCount="indefinite"/>
    </polygon>

    <!-- center node -->
    <circle cx="0" cy="0" r="16" fill="#111C38" stroke="#F97316" stroke-width="2.5" filter="url(#g2)"/>
    <text x="0" y="4" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#F97316" text-anchor="middle">SCORE</text>
  </g>

  <!-- factor streams -->
  
    <!-- SEVERITY -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="0.5s"/>
      <circle cx="600" cy="45" r="22" fill="#111C38" stroke="#EF4444" stroke-width="2"/>
      <text x="600" y="49" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#EF4444" text-anchor="middle">SEVERITY</text>
      <!-- data stream toward center -->
      <line x1="600" y1="45" x2="600" y2="245" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
      <circle r="4" fill="#EF4444" filter="url(#g2)">
        <animate attributeName="cx" values="600;600" dur="2.0s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="45;245" dur="2.0s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- AGE -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="1.0s"/>
      <circle cx="800" cy="245" r="22" fill="#111C38" stroke="#F59E0B" stroke-width="2"/>
      <text x="800" y="249" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#F59E0B" text-anchor="middle">AGE</text>
      <!-- data stream toward center -->
      <line x1="800" y1="245" x2="600" y2="245" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
      <circle r="4" fill="#F59E0B" filter="url(#g2)">
        <animate attributeName="cx" values="800;600" dur="2.3s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="245;245" dur="2.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- DENSITY -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="1.5s"/>
      <circle cx="600" cy="445" r="22" fill="#111C38" stroke="#3B82F6" stroke-width="2"/>
      <text x="600" y="449" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#3B82F6" text-anchor="middle">DENSITY</text>
      <!-- data stream toward center -->
      <line x1="600" y1="445" x2="600" y2="245" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
      <circle r="4" fill="#3B82F6" filter="url(#g2)">
        <animate attributeName="cx" values="600;600" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="445;245" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- RECURRENCE -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="2.0s"/>
      <circle cx="400" cy="245" r="22" fill="#111C38" stroke="#8B5CF6" stroke-width="2"/>
      <text x="400" y="249" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#8B5CF6" text-anchor="middle">RECURRENCE</text>
      <!-- data stream toward center -->
      <line x1="400" y1="245" x2="600" y2="245" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
      <circle r="4" fill="#8B5CF6" filter="url(#g2)">
        <animate attributeName="cx" values="400;600" dur="2.9s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="245;245" dur="2.9s" repeatCount="indefinite"/>
      </circle>
    </g>

  <!-- output -->
  <g transform="translate(600,475)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="3s"/>
    <rect x="-50" y="-14" width="100" height="28" rx="14" fill="#F97316" filter="url(#g1)"/>
    <text x="0" y="5" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">PRIORITY</text>
  </g>

  <text x="600" y="35" font-family="Arial,sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="5">ALGORITHMIC SCORING MATRIX</text>
</svg>