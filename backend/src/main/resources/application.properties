server.port=8080

# Spring Data JPA / Database Configuration
# Default: embedded in-memory database with PostgreSQL compatibility mode for instant local testing
spring.datasource.url=jdbc:h2:mem:cleanops_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.cleanops=DEBUG
